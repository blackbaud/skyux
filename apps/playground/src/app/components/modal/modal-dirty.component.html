<sky-modal headingText="Dirty modal" [isDirty]="isDirty">
  <sky-modal-content>
    <p>
      Flag the modal as dirty to trigger a confirmation message when closing.
    </p>
    <sky-toggle-switch labelText="Dirty" [(ngModel)]="isDirty" />
  </sky-modal-content>
  <sky-modal-footer>
    <button type="button" class="sky-btn sky-btn-primary" (click)="save()">
      Save
    </button>
    <button type="button" class="sky-btn sky-btn-link" (click)="cancel()">
      Cancel
    </button>
  </sky-modal-footer>
</sky-modal>
