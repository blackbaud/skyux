<sky-modal headingText="Errors modal" [formErrors]="errors">
  <sky-modal-content>
    <p>Check the box to trigger an error message when closing.</p>
    <sky-toggle-switch labelText="Error" [(ngModel)]="isError" />
    <button
      type="button"
      class="sky-btn sky-btn-default"
      (click)="clearErrors()"
    >
      Clear errors
    </button>
  </sky-modal-content>
  <sky-modal-footer>
    <button type="button" class="sky-btn sky-btn-primary" (click)="save()">
      Save
    </button>
    <button type="button" class="sky-btn sky-btn-link" (click)="cancel()">
      Cancel
    </button>
  </sky-modal-footer>
</sky-modal>
