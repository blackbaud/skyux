<sky-chart
  class="sky-theme-margin-bottom-l"
  headingText="Revenue by month"
  subheadingText="Currency format: values display with the specified currency code (EUR)."
>
  <sky-chart-line>
    <sky-chart-axis-category
      labelHidden
      labelText="Month"
      [categories]="months"
    />
    <sky-chart-axis-value
      currencyCode="EUR"
      digits="0"
      format="currency"
      labelText="Revenue"
    />
    <sky-chart-line-series labelText="Revenue" [values]="revenue" />
  </sky-chart-line>
</sky-chart>

<sky-chart
  headingText="Conversion rate by month"
  subheadingText="Percent format: fractional values display as percentages, so 0.25 shows as 25%."
>
  <sky-chart-line>
    <sky-chart-axis-category
      labelHidden
      labelText="Month"
      [categories]="months"
    />
    <sky-chart-axis-value format="percent" labelText="Conversion rate" />
    <sky-chart-line-series
      labelText="Conversion rate"
      [values]="conversionRate"
    />
  </sky-chart-line>
</sky-chart>
