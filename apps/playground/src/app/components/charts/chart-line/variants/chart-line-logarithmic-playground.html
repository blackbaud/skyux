<sky-chart headingText="Spending by category">
  <sky-chart-line>
    <sky-chart-axis-category labelText="Category" [categories]="categories" />
    <sky-chart-axis-value labelText="Value" scaleType="logarithmic" />
    <sky-chart-line-series labelText="Spending" [values]="values" />
  </sky-chart-line>
</sky-chart>
