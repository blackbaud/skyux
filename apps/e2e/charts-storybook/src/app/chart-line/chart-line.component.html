<sky-chart headingText="Acquisitions by year">
  <sky-chart-line>
    <sky-chart-axis-category labelText="Year" [categories]="years" />
    <sky-chart-axis-value labelText="Acquisitions" />
    <sky-chart-line-series
      labelText="Acquisitions by year"
      [values]="acquisitions"
    />
  </sky-chart-line>
</sky-chart>

<sky-chart id="actual-vs-target-chart" headingText="Actual vs. target">
  <sky-chart-line>
    <sky-chart-axis-category labelText="Year" [categories]="years" />
    <sky-chart-axis-value labelText="Acquisitions" />
    <sky-chart-line-series labelText="Actual" [values]="acquisitions" />
    <sky-chart-line-series labelText="Target" [values]="target" />
  </sky-chart-line>
</sky-chart>

<sky-chart headingText="Actual vs. target, emphasized">
  <sky-chart-line>
    <sky-chart-axis-category labelText="Year" [categories]="years" />
    <sky-chart-axis-value labelText="Acquisitions" />
    <sky-chart-line-series
      labelText="Actual"
      [emphasized]="true"
      [values]="acquisitions"
    />
    <sky-chart-line-series labelText="Target" [values]="target" />
  </sky-chart-line>
</sky-chart>

<sky-chart headingText="Donations by year">
  <sky-chart-line>
    <sky-chart-axis-category labelText="Year" [categories]="years" />
    <sky-chart-axis-value labelText="Donations" format="currency" />
    <sky-chart-line-series labelText="Donations" [values]="donations" />
  </sky-chart-line>
</sky-chart>

<sky-chart headingText="Scores at the axis limits">
  <sky-chart-line>
    <sky-chart-axis-category labelText="Year" [categories]="years" />
    <sky-chart-axis-value labelText="Score" [max]="100" [min]="0" />
    <sky-chart-line-series labelText="Score" [values]="edgeScores" />
  </sky-chart-line>
</sky-chart>
