<sky-toolbar>
  <sky-toolbar-item>
    <button type="button" class="sky-btn sky-btn-primary">
      <!-- The margin style here is to properly space the icon and button text in modern theme. This is not possible in the toolbar item with pure css today because you can't distinguish pure text nodes in css. -->
      <sky-icon
        iconName="add"
        [ngClass]="{
          'sky-theme-margin-right-xs': theme === 'modern'
        }"
      />
      Button 0
    </button>
  </sky-toolbar-item>
  <sky-toolbar-item>
    <button type="button" class="sky-btn sky-btn-default">Button 1</button>
  </sky-toolbar-item>
  <sky-toolbar-item>
    <button type="button" class="sky-btn sky-btn-primary" disabled>
      Disabled (primary)
    </button>
  </sky-toolbar-item>
  <sky-toolbar-item>
    <button type="button" class="sky-btn sky-btn-default" disabled>
      Disabled (default)
    </button>
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-filter-button [showButtonText]="true" />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-filter-button [active]="true" [showButtonText]="true" />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-search [debounceTime]="250" />
  </sky-toolbar-item>
  <sky-toolbar-view-actions>
    <sky-radio-group class="sky-switch-icon-group" [(ngModel)]="activeViewId">
      <sky-radio iconName="table" label="Table" value="table" />
      <sky-radio iconName="list" label="List" value="list" />
      <sky-radio iconName="location" label="Map" value="map" />
    </sky-radio-group>

    <button
      class="sky-btn sky-btn-default sky-btn-icon"
      title="Sort descending"
      type="button"
    >
      <sky-icon iconName="chevron-double-down" />
    </button>
    <button
      class="sky-btn sky-btn-default sky-btn-icon"
      title="Sort ascending"
      type="button"
    >
      <sky-icon iconName="chevron-double-up" />
    </button>
  </sky-toolbar-view-actions>
</sky-toolbar>

<sky-box headingText="Toolbar in a box">
  <sky-box-content>
    <p class="app-reference-text">
      A toolbar in a container inherits the container's padding, so its buttons
      line up with the text above and below it.
    </p>
    <sky-toolbar>
      <sky-toolbar-item>
        <button type="button" class="sky-btn sky-btn-primary">New</button>
      </sky-toolbar-item>
      <sky-toolbar-item>
        <button type="button" class="sky-btn sky-btn-default">Edit</button>
      </sky-toolbar-item>
    </sky-toolbar>
    <p class="app-reference-text">
      This paragraph sits on the same left edge as the buttons above.
    </p>
  </sky-box-content>
</sky-box>

<!--
  `sky-layout-host-list` is the class SkyLayoutHostDirective applies for a page
  or tab with layout="list". Applying it directly keeps this app free of a
  dependency on @skyux/pages and @skyux/tabs; the directive's own specs cover
  putting the class on the element. In a list layout there is no parent padding
  to inherit, so the toolbar keeps its own inset.
-->
<div class="sky-layout-host-list">
  <sky-toolbar>
    <sky-toolbar-item>
      <button type="button" class="sky-btn sky-btn-primary">New</button>
    </sky-toolbar-item>
    <sky-toolbar-item>
      <button type="button" class="sky-btn sky-btn-default">Edit</button>
    </sky-toolbar-item>
  </sky-toolbar>
  <sky-toolbar>
    <sky-toolbar-section>
      <sky-toolbar-item>
        <button type="button" class="sky-btn sky-btn-default">Button 1</button>
      </sky-toolbar-item>
      <sky-toolbar-item>
        <button type="button" class="sky-btn sky-btn-default">Button 2</button>
      </sky-toolbar-item>
    </sky-toolbar-section>
  </sky-toolbar>
</div>
