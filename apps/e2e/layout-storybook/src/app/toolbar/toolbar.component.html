<sky-toolbar>
  <sky-toolbar-item>
    <sky-button buttonStyle="primary" iconName="add" labelText="Button 0" />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-button labelText="Button 1" />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-button buttonStyle="primary" disabled labelText="Disabled (primary)" />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-button disabled labelText="Disabled (default)" />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-filter-button [showButtonText]="true" />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-filter-button [active]="true" [showButtonText]="true" />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-search [debounceTime]="250" />
  </sky-toolbar-item>
  <sky-toolbar-view-actions>
    <sky-radio-group class="sky-switch-icon-group" [(ngModel)]="activeViewId">
      <sky-radio iconName="table" label="Table" value="table" />
      <sky-radio iconName="list" label="List" value="list" />
      <sky-radio iconName="location" label="Map" value="map" />
    </sky-radio-group>

    <sky-button
      iconName="chevron-double-down"
      labelHidden
      labelText="Sort descending"
    />
    <sky-button
      iconName="chevron-double-up"
      labelHidden
      labelText="Sort ascending"
    />
  </sky-toolbar-view-actions>
</sky-toolbar>

<sky-toolbar class="sky-padding-even-md">
  <sky-toolbar-section>
    <sky-toolbar-item>
      <sky-button labelText="Button 1" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 2" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 3" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 4" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 5" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 6" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 7" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 8" />
    </sky-toolbar-item>
    <sky-toolbar-view-actions>
      <sky-button
        iconName="chevron-double-down"
        labelHidden
        labelText="Sort descending"
      />
      <sky-button
        iconName="chevron-double-up"
        labelHidden
        labelText="Sort ascending"
      />
    </sky-toolbar-view-actions>
  </sky-toolbar-section>
  <sky-toolbar-section>
    <sky-toolbar-item>
      <sky-button labelText="Button 1" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 2" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 3" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 4" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 5" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 6" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 7" />
    </sky-toolbar-item>
    <sky-toolbar-item>
      <sky-button labelText="Button 8" />
    </sky-toolbar-item>
  </sky-toolbar-section>
</sky-toolbar>

<sky-box headingText="Toolbar in a box">
  <sky-box-content>
    <p class="app-reference-text">
      A toolbar in a container inherits the container's padding, so its buttons
      line up with the text above and below it.
    </p>
    <sky-toolbar>
      <sky-toolbar-item>
        <sky-button buttonStyle="primary" labelText="New" />
      </sky-toolbar-item>
      <sky-toolbar-item>
        <sky-button labelText="Edit" />
      </sky-toolbar-item>
    </sky-toolbar>
    <p class="app-reference-text">
      This paragraph sits on the same left edge as the buttons above.
    </p>
  </sky-box-content>
</sky-box>
