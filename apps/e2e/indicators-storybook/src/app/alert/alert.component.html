@for (variant of variations; track variant) {
  @for (close of closeable; track close) {
    <sky-alert [alertType]="variant" [closeable]="close">
      {{ variant | titlecase }} alert with a <a href="#">link</a> and a
      <a skyHref="https://example.com" data-sky-id="my-href-1">skyHref link</a>
      and a
      <a
        skyHref="deny://example.com"
        skyHrefElse="unlink"
        data-sky-id="my-href-unlinked"
        >skyHref unlinked link</a
      >
      and a
      <button class="sky-btn sky-btn-link-inline" type="button">
        Native button link (inline)
      </button>
      and a
      <sky-button buttonStyle="link-inline" labelText="Button link (inline)" />
      and a
      <sky-button buttonStyle="link" labelText="Button link" />
    </sky-alert>
  }
}
