<div id="screenshot-wrapper" class="sky-padding-even-md">
  <sky-code-block
    class="sky-margin-stacked-lg"
    fileName="greeting.component.ts"
    languageType="typescript"
    [code]="typescriptCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    languageType="json"
    [code]="jsonCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    languageType="html"
    hideCopyToClipboard
    [code]="htmlCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    languageType="css"
    [code]="cssCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    languageType="markdown"
    [code]="markdownCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    languageType="bash"
    [code]="bashCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    hideHeader
    languageType="javascript"
    [code]="longCode"
  />
  <!-- A long file name in a narrow block wraps beside the copy button. -->
  <sky-code-block
    class="narrow-code-block"
    fileName="src/app/components/greeting/greeting.component.ts"
    languageType="typescript"
    code="greet();"
  />
</div>
