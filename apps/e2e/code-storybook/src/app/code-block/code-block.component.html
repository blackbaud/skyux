<div id="screenshot-wrapper" class="sky-padding-even-md">
  <sky-code-block
    class="sky-margin-stacked-lg"
    fileName="greeting.component.ts"
    languageType="typescript"
    [code]="typescriptCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    languageType="json"
    [code]="jsonCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    languageType="xml"
    hideCopyToClipboard
    [code]="htmlCode"
  />
  <sky-code-block
    class="sky-margin-stacked-lg"
    hideHeader
    languageType="javascript"
    [code]="longCode"
  />
</div>
