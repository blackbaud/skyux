<div
  class="dock-item"
  [ngStyle]="{
    'background-color': context?.backgroundColor,
    height: height
  }"
>
  <div class="dock-item-stack-order">
    {{ stackOrderForDisplay }}
  </div>

  <sky-button
    buttonStyle="primary"
    class="sky-theme-margin-right-xs"
    labelText="Set height"
    (buttonClick)="setHeight()"
  />

  <sky-button
    class="sky-theme-margin-right-xs"
    labelText="Close"
    (buttonClick)="onCloseClick()"
  />

  <strong> Unique ID: {{ uniqueId }} </strong>

  <ng-content />
</div>
