@for (container of containers; track container) {
  <div class="icon-container sky-theme-container-{{ container }}">
    <span class="icon-container-name">{{ container }}</span>
    @for (variant of variants; track variant) {
      @for (icon of icons; track icon) {
        <sky-icon iconSize="l" [iconName]="icon" [variant]="variant" />
      }
    }
  </div>
}
