<sky-button
  class="open-small-modal-btn"
  labelText="Open small modal"
  [ngClass]="buttonsHidden ? 'modal-screenshot-buttons-hidden' : ''"
  (buttonClick)="onOpenSmallModalClick()"
/>
<sky-button
  class="open-medium-modal-btn"
  labelText="Open medium modal"
  [ngClass]="buttonsHidden ? 'modal-screenshot-buttons-hidden' : ''"
  (buttonClick)="onOpenMediumModalClick()"
/>
<sky-button
  class="open-large-modal-btn"
  labelText="Open large modal"
  [ngClass]="buttonsHidden ? 'modal-screenshot-buttons-hidden' : ''"
  (buttonClick)="onOpenLargeModalClick()"
/>
<sky-button
  class="open-full-page-modal-btn"
  labelText="Open full page modal"
  [ngClass]="buttonsHidden ? 'modal-screenshot-buttons-hidden' : ''"
  (buttonClick)="onOpenFullPageModalClick()"
/>
<sky-button
  class="open-help-inline-modal-btn"
  labelText="Open help inline modal"
  [ngClass]="buttonsHidden ? 'modal-screenshot-buttons-hidden' : ''"
  (buttonClick)="onOpenHelpInlineModalClick()"
/>
<sky-button
  class="open-error-modal-btn"
  labelText="Open error modal"
  [ngClass]="buttonsHidden ? 'modal-screenshot-buttons-hidden' : ''"
  (buttonClick)="onOpenErrorModalClick()"
/>
<sky-button
  class="open-positioned-background-modal-btn"
  labelText="Open modal with absolutely-positioned background"
  [ngClass]="buttonsHidden ? 'modal-screenshot-buttons-hidden' : ''"
  (buttonClick)="onOpenModalWithPositionedElClick()"
/>
<sky-button
  class="open-heading-text-help-inline-modal-btn"
  labelText="Open help inline modal (heading text)"
  [ngClass]="{
    'modal-screenshot-buttons-hidden': buttonsHidden
  }"
  (buttonClick)="onOpenHeadingTextHelpInlineModalClick()"
/>
<sky-button
  class="open-heading-hidden-modal-btn"
  labelText="Open heading hidden modal"
  [ngClass]="{
    'modal-screenshot-buttons-hidden': buttonsHidden
  }"
  (buttonClick)="onOpenHeadingHiddenModalClick()"
/>
<sky-button
  class="open-banner-content-modal-btn"
  labelText="Open banner content modal"
  [ngClass]="{
    'modal-screenshot-buttons-hidden': buttonsHidden
  }"
  (buttonClick)="onOpenBannerContentModalClick()"
/>
<sky-button
  class="open-banner-image-modal-btn"
  labelText="Open banner image modal"
  [ngClass]="{
    'modal-screenshot-buttons-hidden': buttonsHidden
  }"
  (buttonClick)="onOpenBannerImageModalClick()"
/>
<sky-button
  class="open-banner-content-image-modal-btn"
  labelText="Open banner content and image modal"
  [ngClass]="{
    'modal-screenshot-buttons-hidden': buttonsHidden
  }"
  (buttonClick)="onOpenBannerContentImageModalClick()"
/>
<sky-button
  class="open-banner-heading-visible-modal-btn"
  labelText="Open banner image with heading visible modal"
  [ngClass]="{
    'modal-screenshot-buttons-hidden': buttonsHidden
  }"
  (buttonClick)="onOpenBannerHeadingVisibleModalClick()"
/>
<sky-button
  class="open-sky-button-modal-btn"
  labelText="Open sky-button modal"
  [ngClass]="{
    'modal-screenshot-buttons-hidden': buttonsHidden
  }"
  (buttonClick)="onOpenSkyButtonModalClick()"
/>

@if (showPositionedEl) {
  <div class="modal-screenshot-positioned"></div>
}
