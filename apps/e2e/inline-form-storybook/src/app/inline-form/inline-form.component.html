<sky-inline-form
  [config]="inlineFormConfig"
  [showForm]="showForm"
  [template]="inlineFormTemplate"
>
  <table>
    <tr>
      <th>First name:</th>
      <td>
        {{ firstName }}
      </td>
      <td>
        <sky-button
          buttonStyle="icon-borderless"
          iconName="edit"
          labelHidden
          labelText="Edit"
          (buttonClick)="onInlineFormOpen()"
        />
      </td>
    </tr>
  </table>
</sky-inline-form>

<ng-template #inlineFormTemplate>
  <form novalidate [formGroup]="myForm">
    <sky-input-box labelText="First name" stacked="true">
      <input formControlName="myFirstName" type="text" />
    </sky-input-box>
  </form>
</ng-template>
