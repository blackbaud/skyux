<div class="sky-blockquote">
  <sky-icon
    class="sky-blockquote-icon"
    iconName="text-quote-opening"
    iconSize="l"
    variant="solid"
  />
  <div class="sky-blockquote-content">
    <blockquote class="sky-blockquote-text">
      <ng-content />
    </blockquote>
    @if (author() || quoteSource()) {
      <div class="sky-blockquote-attribution">
        &mdash;
        @if (quoteSource(); as quoteSource) {
          <a class="sky-blockquote-source-link" [href]="quoteSource">{{
            author() || ('skyux_blockquote_source' | skyLibResources)
          }}</a>
        } @else {
          <span>{{ author() }}</span>
        }
      </div>
    }
  </div>
</div>
