<sky-inline-form
  data-sky-id="first-name"
  [config]="inlineFormConfig"
  [showForm]="showForm"
  [template]="inlineFormTemplate"
  (close)="onInlineFormClose($event)"
>
  <table>
    <tr>
      <th>First name:</th>
      <td>
        {{ firstName }}
      </td>
      <td>
        <sky-button
          buttonStyle="icon-borderless"
          data-sky-id="edit-button"
          iconName="edit"
          labelHidden
          labelText="Edit"
          (buttonClick)="onInlineFormOpen()"
        />
      </td>
    </tr>
  </table>
</sky-inline-form>

<ng-template #inlineFormTemplate>
  <form [formGroup]="formGroup">
    <sky-input-box labelText="First name">
      <input formControlName="firstName" type="text" />
    </sky-input-box>
  </form>
</ng-template>
