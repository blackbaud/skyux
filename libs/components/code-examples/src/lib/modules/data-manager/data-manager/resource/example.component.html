<sky-data-manager>
  <sky-data-manager-toolbar
    labelText="fruit"
    [searchEnabled]="true"
    [pageSize]="3"
    [totalCount]="totalCount"
  >
    <sky-data-manager-sort-option
      propertyName="name"
      label="Name (A - Z)"
      [id]="'az'"
    />
    <sky-data-manager-sort-option
      propertyName="name"
      label="Name (Z - A)"
      [id]="'za'"
      [descending]="true"
    />
  </sky-data-manager-toolbar>

  <ul>
    @for (item of data.value()?.items; track item.id) {
      <li>{{ item.name }}</li>
    } @empty {
      <li>No fruit found.</li>
    }
  </ul>
</sky-data-manager>
