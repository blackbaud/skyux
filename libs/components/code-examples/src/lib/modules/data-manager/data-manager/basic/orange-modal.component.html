<sky-modal [headingText]="modalLabel">
  <sky-modal-content>
    <sky-checkbox labelText="Hide orange fruits" [formControl]="hideOrange" />
  </sky-modal-content>
  <sky-modal-footer>
    <sky-button
      buttonStyle="primary"
      labelText="Apply"
      (buttonClick)="applyFilters()"
    />
    <sky-button
      buttonStyle="link"
      labelText="Cancel"
      (buttonClick)="cancel()"
    />
  </sky-modal-footer>
</sky-modal>
