<form [formGroup]="formGroup" (submit)="modalInstance.save()">
  <sky-modal data-sky-id="settings-modal" [headingText]="title">
    <sky-modal-content>
      @for (field of fields; track field) {
        <ng-container class="row">
          @switch (title) {
            @case ('Color') {
              <sky-colorpicker #colorPicker stacked [labelText]="field">
                <input
                  type="text"
                  [formControlName]="field"
                  [skyColorpickerInput]="colorPicker"
                />
              </sky-colorpicker>
            }
            @default {
              <sky-input-box stacked [labelText]="field">
                <input type="text" [formControlName]="field" />
              </sky-input-box>
            }
          }
        </ng-container>
      }
    </sky-modal-content>
    <sky-modal-footer>
      <sky-button
        buttonStyle="primary"
        buttonType="submit"
        class="sky-theme-margin-right-s"
        data-sky-id="settings-save-button"
        labelText="Save"
      />
      <sky-button
        buttonStyle="link"
        labelText="Close"
        (buttonClick)="modalInstance.close()"
      />
    </sky-modal-footer>
  </sky-modal>
</form>
