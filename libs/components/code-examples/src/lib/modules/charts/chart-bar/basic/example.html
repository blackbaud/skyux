<sky-chart
  data-sky-id="acquisitions-by-year"
  headingText="Acquisitions by year"
>
  <sky-chart-bar data-sky-id="acquisitions-bar">
    <sky-chart-axis-category labelText="Year" [categories]="years" />
    <sky-chart-axis-value labelText="Acquisitions" />
    <sky-chart-bar-series
      labelText="Acquisitions by year"
      [values]="acquisitions"
    />
  </sky-chart-bar>
</sky-chart>
