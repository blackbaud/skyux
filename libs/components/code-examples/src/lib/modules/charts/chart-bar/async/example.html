<sky-button
  class="sky-theme-margin-bottom-s"
  labelText="Reload data"
  [disabled]="donations.isLoading()"
  (buttonClick)="donations.reload()"
/>
<sky-chart
  data-sky-id="donations-by-quarter"
  headingText="Donations by quarter"
  [loading]="donations.isLoading()"
>
  @if (donations.value(); as data) {
    <sky-chart-bar>
      <sky-chart-axis-category
        labelText="Quarter"
        [categories]="data.categories"
      />
      <sky-chart-axis-value format="currency" labelText="Donations" />
      <sky-chart-bar-series labelText="Donations" [values]="data.values" />
    </sky-chart-bar>
  }
</sky-chart>
