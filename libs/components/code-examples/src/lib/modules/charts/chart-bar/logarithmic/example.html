<sky-chart data-sky-id="monthly-spending" headingText="Monthly spending">
  <sky-chart-bar>
    <sky-chart-axis-category labelText="Month" [categories]="categories" />
    <sky-chart-axis-value labelText="Value" scaleType="logarithmic" />
    <sky-chart-bar-series labelText="Spending" [values]="values" />
  </sky-chart-bar>
</sky-chart>
