<p>
  These tokens define a custom property to display their values. When users
  select a token, it emits an event.
</p>

<div class="sky-theme-margin-bottom-xl">
  <sky-tokens
    data-sky-id="example-tokens"
    displayWith="label"
    [messageStream]="tokensController"
    [(tokens)]="myTokens"
    (focusIndexOverRange)="onFocusIndexOverRange()"
    (focusIndexUnderRange)="onFocusIndexUnderRange()"
    (tokenSelected)="onTokenSelected($event)"
  >
    (You may also include content inside the tokens component.)
  </sky-tokens>
</div>

<div class="sky-theme-margin-bottom-xl">
  <sky-button
    class="sky-theme-margin-right-s"
    data-sky-id="tokens-example-change-button"
    labelText="Change tokens"
    (buttonClick)="changeTokens()"
  />

  <sky-button
    class="sky-theme-margin-right-s"
    data-sky-id="tokens-example-reset-button"
    labelText="Reset tokens"
    (buttonClick)="resetTokens()"
  />

  <sky-button
    class="sky-theme-margin-right-s"
    data-sky-id="tokens-example-destroy-button"
    labelText="Destroy tokens"
    (buttonClick)="destroyTokens()"
  />

  <sky-button
    class="sky-theme-margin-right-s"
    data-sky-id="tokens-example-focus-last-button"
    labelText="Focus last token"
    (buttonClick)="focusLastToken()"
  />
</div>

<div>
  Selected token:
  <span class="tokens-example-selected">{{ selectedToken }}</span>
</div>
