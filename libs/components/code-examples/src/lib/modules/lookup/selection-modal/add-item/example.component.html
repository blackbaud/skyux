<div class="sky-theme-margin-bottom-xl">
  <sky-button
    ariaHasPopup="dialog"
    data-sky-id="show-selection-modal-button"
    labelText="Select a value"
    (buttonClick)="showSelectionModal()"
  />
</div>

@if (selectedPeople?.length) {
  <div>
    Selected people:
    <ul class="selection-modal-example-selected">
      @for (selectedPerson of selectedPeople; track selectedPerson) {
        <li>
          {{ selectedPerson.name }}
        </li>
      }
    </ul>
  </div>
}
