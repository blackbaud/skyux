<form novalidate [formGroup]="formGroup" (ngSubmit)="save()">
  <sky-modal headingText="Add Item">
    <sky-modal-content>
      <sky-input-box
        labelText="Name"
        hintText="Find an individual by first name"
      >
        <input
          type="text"
          autocapitalize="words"
          autocomplete="off"
          formControlName="name"
        />
      </sky-input-box>
    </sky-modal-content>
    <sky-modal-footer>
      <sky-button labelText="Cancel" (buttonClick)="close()" />
      <sky-button buttonStyle="primary" buttonType="submit" labelText="Add" />
    </sky-modal-footer>
  </sky-modal>
</form>
