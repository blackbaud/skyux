<form class="filter-modal-demo-form" novalidate [formGroup]="formGroup">
  <sky-modal [headingText]="headingText">
    <sky-modal-content>
      <sky-radio-group formControlName="selectedOption">
        @for (option of options; track option.value) {
          <sky-radio [value]="option.value" [labelText]="option.displayValue" />
        }
      </sky-radio-group>
    </sky-modal-content>
    <sky-modal-footer>
      <sky-button
        buttonStyle="primary"
        data-sky-id="save-button"
        labelText="Save"
        (buttonClick)="save()"
      />
      <sky-button
        buttonStyle="link"
        data-sky-id="cancel-button"
        labelText="Cancel"
        (buttonClick)="modalInstance.cancel()"
      />
    </sky-modal-footer>
  </sky-modal>
</form>
