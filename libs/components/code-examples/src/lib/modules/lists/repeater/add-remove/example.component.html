<div class="sky-theme-margin-bottom-l">
  <sky-repeater
    data-sky-id="repeater-example"
    selectionMode="multiple"
    [expandMode]="'single'"
    [reorderable]="true"
    (orderChange)="changeItems($event)"
  >
    @for (item of items; track item) {
      <sky-repeater-item
        [tag]="item.note"
        [disabled]="item.isDisabled"
        [(isSelected)]="item.isSelected"
      >
        <sky-repeater-item-title class="example-repeater-flex">
          <div class="example-repeater-item-title">
            {{ item.title }}
          </div>
          <div>
            {{ item.status }}
          </div>
        </sky-repeater-item-title>
        <sky-repeater-item-context-menu>
          <sky-dropdown buttonType="context-menu">
            <sky-dropdown-menu>
              <sky-dropdown-item>
                <button type="button" (click)="onActionClicked('Action 1')">
                  Action 1
                </button>
              </sky-dropdown-item>
              <sky-dropdown-item>
                <button type="button" (click)="onActionClicked('Action 2')">
                  Action 2
                </button>
              </sky-dropdown-item>
            </sky-dropdown-menu>
          </sky-dropdown>
        </sky-repeater-item-context-menu>
        <sky-repeater-item-content>
          {{ item.note }}
        </sky-repeater-item-content>
      </sky-repeater-item>
    }
  </sky-repeater>
</div>

<sky-button
  class="sky-theme-margin-right-s"
  data-sky-id="add-button"
  labelText="Add item"
  (buttonClick)="addItem()"
/>

<sky-button
  class="sky-theme-margin-right-s"
  data-sky-id="remove-button"
  labelText="Remove selected items"
  (buttonClick)="removeItems()"
/>
