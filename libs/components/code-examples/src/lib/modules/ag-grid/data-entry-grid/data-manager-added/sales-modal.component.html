<sky-modal [headingText]="modalLabel">
  <sky-modal-content>
    <sky-checkbox
      data-sky-id="hide-sales-checkbox"
      labelText="Hide Sales employees"
      [(ngModel)]="hideSales"
    />
  </sky-modal-content>
  <sky-modal-footer>
    <sky-button
      buttonStyle="primary"
      data-sky-id="apply-button"
      labelText="Apply"
      (buttonClick)="applyFilters()"
    />
    <sky-button
      buttonStyle="link"
      data-sky-id="cancel-button"
      labelText="Cancel"
      (buttonClick)="cancel()"
    />
  </sky-modal-footer>
</sky-modal>
