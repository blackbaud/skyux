<sky-toolbar>
  <sky-toolbar-item>
    <sky-button
      buttonStyle="primary"
      data-sky-id="edit-button"
      labelText="Edit"
      (buttonClick)="openModal()"
    />
  </sky-toolbar-item>
  <sky-toolbar-item>
    <sky-search
      data-sky-id="grid-search"
      [debounceTime]="250"
      (searchApply)="searchApplied($event)"
      (searchChange)="searchApplied($event)"
      (searchClear)="searchApplied($event)"
    />
  </sky-toolbar-item>
</sky-toolbar>

<sky-ag-grid-wrapper data-sky-id="inline-help-grid">
  <ag-grid-angular
    [gridOptions]="gridOptions"
    [quickFilterText]="searchText()"
    [rowData]="gridData()"
  />
</sky-ag-grid-wrapper>
