<sky-modal data-sky-id="edit-modal" headingText="Edit employee information">
  <sky-modal-content>
    <sky-ag-grid-wrapper data-sky-id="edit-modal-grid">
      <ag-grid-angular
        class="sky-ag-grid-editable"
        [gridOptions]="gridOptions"
        [rowData]="gridData"
      />
    </sky-ag-grid-wrapper>
  </sky-modal-content>
  <sky-modal-footer>
    <sky-button
      buttonStyle="primary"
      data-sky-id="save-button"
      labelText="Save"
      (buttonClick)="saveData()"
    />
    <sky-button
      buttonStyle="link"
      data-sky-id="cancel-button"
      labelText="Cancel"
      (buttonClick)="instance.cancel()"
    />
  </sky-modal-footer>
</sky-modal>
