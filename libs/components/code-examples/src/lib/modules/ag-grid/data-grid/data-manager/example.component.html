<sky-data-manager data-sky-id="employees-data-manager">
  <sky-data-manager-toolbar>
    <sky-filter-bar
      data-sky-id="employees-filter-bar"
      skyDataManagerFilterController
    >
      <sky-filter-item-modal
        filterId="hideSales"
        labelText="Hide sales"
        modalSize="small"
        [modalComponent]="salesModal"
      />
      <sky-filter-item-lookup
        filterId="jobTitle"
        labelText="Job title"
        searchDescriptorProperty="name"
        searchIdProperty="id"
        (searchAsync)="onJobTitleSearchAsync($event)"
      />
    </sky-filter-bar>
    <sky-list-summary data-sky-id="employees-summary">
      <sky-list-summary-item
        [labelText]="recordCount() === 1 ? 'Record' : 'Records'"
        [value]="recordCount()"
      />
    </sky-list-summary>
  </sky-data-manager-toolbar>
  <app-view-grid [items]="items" />
</sky-data-manager>
