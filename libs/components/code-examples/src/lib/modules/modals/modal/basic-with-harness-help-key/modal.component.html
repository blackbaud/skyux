<form [formGroup]="exampleForm" (submit)="saveForm()">
  <sky-modal
    data-sky-id="modal-example"
    headingText="Modal title"
    helpKey="modal-help"
    [isDirty]="exampleForm.dirty"
  >
    <sky-modal-content>
      <sky-input-box labelText="An input inside a modal">
        <input formControlName="value1" type="text" />
      </sky-input-box>
    </sky-modal-content>
    <sky-modal-footer>
      <sky-button buttonStyle="primary" buttonType="submit" labelText="Save" />
      <sky-button
        buttonStyle="link"
        labelText="Cancel"
        (buttonClick)="cancelForm()"
      />
    </sky-modal-footer>
  </sky-modal>
</form>
