<form class="sky-theme-margin-bottom-xxl" [formGroup]="formGroup">
  <sky-colorpicker
    #colorPicker
    labelText="What is your favorite color?"
    hintText="Pick a color with at least 80% opacity."
    [messageStream]="colorpickerController"
    [showResetButton]="showResetButton"
    [stacked]="true"
  >
    <input
      formControlName="favoriteColor"
      type="text"
      [skyColorpickerInput]="colorPicker"
    />
    @if (favoriteColor.errors?.['opaque']) {
      <sky-form-error
        errorName="opaque"
        errorText="Color must have at least 80% opacity."
      />
    }
  </sky-colorpicker>
</form>

<sky-button
  class="sky-theme-margin-right-s"
  labelText="Open colorpicker"
  (buttonClick)="openColorpicker()"
/>

<sky-button
  class="sky-theme-margin-right-s"
  labelText="Reset colorpicker"
  (buttonClick)="resetColorpicker()"
/>

<sky-button
  class="sky-theme-margin-right-s"
  labelText="Toggle reset button"
  (buttonClick)="toggleResetButton()"
/>
