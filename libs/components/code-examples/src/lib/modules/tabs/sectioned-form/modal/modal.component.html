<sky-modal [headingText]="'Sectioned form — Index: ' + activeIndexDisplay">
  <sky-modal-content>
    <sky-sectioned-form
      data-sky-id="modal-sectioned-form"
      tabWidth="auto"
      [messageStream]="sectionedFormController"
      (indexChanged)="onIndexChanged($event)"
      (tabsVisibleChanged)="onTabsVisibleChanged($event)"
    >
      <sky-sectioned-form-section heading="Basic information">
        <app-information-form />
      </sky-sectioned-form-section>
      <sky-sectioned-form-section
        heading="Addresses"
        [itemCount]="2"
        [active]="activeTab"
      >
        <app-address-form />
      </sky-sectioned-form-section>
      <sky-sectioned-form-section heading="Phone numbers" [itemCount]="3">
        <app-phone-form />
      </sky-sectioned-form-section>
    </sky-sectioned-form>
  </sky-modal-content>
  <sky-modal-footer>
    @if (tabsHidden) {
      <sky-button
        iconName="chevron-left"
        labelText="Show sections"
        (buttonClick)="showTabs()"
      />
    }
    <sky-button
      buttonStyle="primary"
      labelText="Save"
      (buttonClick)="modalInstance.save()"
    />
    <sky-button
      buttonStyle="link"
      labelText="Cancel"
      (buttonClick)="modalInstance.cancel()"
    />
  </sky-modal-footer>
</sky-modal>
