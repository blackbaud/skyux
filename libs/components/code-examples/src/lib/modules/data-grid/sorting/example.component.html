<sky-box class="sky-theme-margin-bottom-l">
  <sky-box-content>
    Current sort:
    <strong data-sky-id="current-sort" class="sky-theme-margin-right-s">{{
      sortDescription()
    }}</strong>
    <sky-button
      class="sky-theme-margin-right-s"
      data-sky-id="sort-by-age-button"
      labelText="Sort by age (descending)"
      (buttonClick)="sortByAgeDescending()"
    />
    <sky-button
      data-sky-id="clear-sort-button"
      labelText="Clear sort"
      (buttonClick)="clearSort()"
    />
  </sky-box-content>
</sky-box>

<sky-data-grid data-sky-id="example-data-grid" [data]="data" [(sort)]="sort">
  <sky-data-grid-column field="name" headingText="Name" />
  <sky-data-grid-column
    field="age"
    headingText="Age"
    dataType="number"
    width="80"
    helpPopoverTitle="Age"
    helpPopoverContent="The team member's current age, in years."
  />
  <sky-data-grid-column
    field="startDate"
    headingText="Start date"
    dataType="date"
    helpKey="start-date-help"
  />
</sky-data-grid>
