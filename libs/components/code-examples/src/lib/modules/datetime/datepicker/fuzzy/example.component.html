<div class="sky-theme-padding-inset-balanced-l">
  <form [formGroup]="formGroup">
    <sky-input-box
      data-sky-id="fuzzy-datepicker-example"
      labelText="Date of birth"
      [helpPopoverContent]="helpPopoverContent"
      [hintText]="hintText"
    >
      <sky-datepicker>
        <input
          formControlName="dob"
          skyFuzzyDatepickerInput
          type="text"
          [futureDisabled]="true"
        />
      </sky-datepicker>
    </sky-input-box>
  </form>

  <p>
    Selected date: <sky-code>{{ getFuzzyDateForDisplay }}</sky-code>
  </p>
</div>
