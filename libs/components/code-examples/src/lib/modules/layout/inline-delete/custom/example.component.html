<div class="inline-delete-container">
  <strong>Custom content</strong>
  <div>
    <sky-button
      buttonStyle="danger"
      block
      class="inline-delete-trigger"
      iconName="delete"
      labelHidden
      labelText="Delete"
      (buttonClick)="deleteItem()"
    />
  </div>
  @if (deleting) {
    <sky-inline-delete
      data-sky-id="inline-delete-custom"
      [pending]="pending"
      (cancelTriggered)="onCancelTriggered()"
      (deleteTriggered)="onDeleteTriggered()"
    />
  }
</div>
