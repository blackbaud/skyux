<div class="sky-theme-margin-bottom-s">
  <sky-button labelText="Simple button" (click)="buttonClick()" />
</div>

<div class="sky-theme-margin-bottom-s">
  <sky-button
    disabled
    labelText="Simple button disabled"
    (click)="buttonClick()"
  />
</div>

<div class="sky-theme-margin-bottom-s">
  <sky-button
    iconName="add"
    labelText="Button with icon"
    (click)="buttonClick()"
  />
</div>

<div class="sky-theme-margin-bottom-s">
  <sky-button
    buttonStyle="primary"
    iconName="add"
    labelText="Primary button with icon"
    (click)="buttonClick()"
  />
</div>

<div class="sky-theme-margin-bottom-s">
  <sky-button
    iconName="add"
    labelText="Icon only"
    labelHidden
    (click)="buttonClick()"
  />
</div>

<div class="sky-theme-margin-bottom-s">
  <sky-button
    block
    iconName="add"
    labelText="Block button with icon"
    (click)="buttonClick()"
  />
</div>

<div class="sky-theme-margin-bottom-s">
  <sky-button
    block
    iconName="google-branded"
    labelText="Block button with logo"
    logo
    (click)="buttonClick()"
  />
</div>

<div class="sky-theme-margin-bottom-s">
  <sky-button
    buttonStyle="link"
    iconName="add"
    labelText="Link button with icon"
    (click)="buttonClick()"
  />
</div>

<div class="sky-theme-margin-bottom-s">
  <sky-button
    buttonStyle="link-inline"
    labelText="Link inline button"
    (click)="buttonClick()"
  />
</div>
