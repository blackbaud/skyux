<div
  [skyInstrumentationContext]="{
    name: 'constituent-summary',
    detail: { recordId: '280-c-r-w' }
  }"
>
  <h2>
    Constituent summary
    <sky-help-inline
      data-sky-id="page-help"
      helpKey="constituent-summary.html"
      labelText="Constituent summary"
    />
  </h2>

  <div [skyInstrumentationContext]="{ name: 'giving-history' }">
    <button
      class="sky-btn sky-btn-default"
      data-sky-id="export-gifts"
      type="button"
      skyInstrumentationTrackClick
      skyInstrumentationEventName="constituents.gifts-exported"
      [skyInstrumentationEventDetail]="{ format: 'csv' }"
    >
      Export gifts
    </button>
  </div>
</div>
