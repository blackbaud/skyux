<div [skyInstrumentationContext]="{ pageId: 'constituent-summary' }">
  <h2>
    Constituent summary
    <sky-help-inline
      data-sky-id="page-help"
      helpKey="constituent-summary.html"
      labelText="Constituent summary"
    />
  </h2>

  <div [skyInstrumentationContext]="{ sectionId: 'giving-history' }">
    <button
      data-sky-id="my-tracked-button"
      type="button"
      skyInstrumentationTrackClick
      skyInstrumentationEventName="foo.bar"
      [skyInstrumentationEventDetail]="{ some: 'foo' }"
    >
      Click me
    </button>
  </div>
</div>
