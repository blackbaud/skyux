<canvas #chartRef aria-hidden="true"></canvas>
<sky-chart-data-points
  [chartType]="chartType()"
  [clickable]="dataPointsClickable()"
  [horizontal]="horizontal()"
  [series]="series()"
  (dataPointClick)="dataPointClick.emit($event)"
  (dataPointFocusChange)="onDataPointFocusChange($event)"
  (tooltipDismiss)="onTooltipDismiss()"
/>
