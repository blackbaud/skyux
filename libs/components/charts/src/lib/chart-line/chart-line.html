@if (chartJsConfig(); as config) {
  <sky-chart-js
    [config]="config"
    [dataPointsClickable]="dataPointClickSource.observed"
    [seriesSummaryResourceKeys]="seriesSummaryResourceKeys"
    [style.height]="chartHeight()"
    (dataPointClick)="onDataPointClick($event)"
  />
  @if (legendItems().length > 1) {
    <sky-chart-legend
      [items]="legendItems()"
      (itemToggle)="toggleSeries($event)"
    />
  }
}
