<button
  [ariaLabel]="labelHidden() ? labelText() : null"
  [class]="buttonClass()"
  [disabled]="disabled()"
  [type]="buttonType()"
  (click)="buttonClick.emit($event)"
>
  @if (iconName(); as iconName) {
    <sky-icon
      [class]="{
        'sky-theme-margin-right-xs': !labelHidden(),
        'sky-btn-block-logo': iconLogo()
      }"
      [iconName]="iconName"
    />
  }
  @if (!labelHidden()) {
    <span>{{ labelText() }}</span>
  }
</button>
