<sky-button
  data-sky-id="simple-button"
  labelText="Simple button"
  (buttonClick)="buttonClick($event)"
/>
<sky-button
  data-sky-id="icon-only-button"
  iconName="add"
  labelText="Icon only"
  labelHidden
/>
<sky-button
  buttonStyle="primary"
  buttonType="submit"
  data-sky-id="primary-submit-button"
  labelText="Primary submit"
/>
<sky-button block data-sky-id="block-button" labelText="Block button" />
<sky-button
  block
  data-sky-id="block-logo-button"
  iconName="apple-branded"
  labelText="Block button logo"
  logo
/>
<sky-button
  data-sky-id="on-prominent-button"
  buttonStyle="icon-borderless-on-prominent"
  iconName="add"
  labelHidden
  labelText="On prominent"
/>
<sky-button
  data-sky-id="disabled-button"
  disabled
  labelText="Disabled button"
/>
