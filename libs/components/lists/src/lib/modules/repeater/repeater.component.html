<ng-container #repeaterHost>
  <div
    class="sky-repeater"
    [class.hover-rows]="selectionMode() === 'single'"
    [attr.role]="role"
    [attr.aria-label]="ariaLabel || ('skyux_repeater_label' | skyLibResources)"
    (cdkObserveContent)="onCdkObserveContent()"
  >
    <ng-content />
  </div>
</ng-container>
