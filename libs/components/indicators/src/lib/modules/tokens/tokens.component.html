<div
  class="sky-tokens"
  [class.sky-tokens-animation-ready]="animationReady()"
  [class.sky-tokens-animation-enabled]="trackWith"
  [attr.role]="gridRoleActive() ? 'grid' : null"
>
  <!--
      The role must use square brackets otherwise Angular sets the native 'role'
      attribute as well as the input attribute of the token, which fails accessibility rules.
    -->
  @for (token of tokens; track trackTokenFn(i, token); let i = $index) {
    <sky-token
      animate.enter="sky-token-enter"
      animate.leave="sky-token-leave"
      [disabled]="disabled"
      [dismissible]="dismissible"
      [focusable]="focusable"
      [role]="'row'"
      (dismiss)="removeToken(token)"
      (click)="onTokenClick(token)"
      (keydown)="onTokenKeyDown($event)"
      (keyup.enter)="selectToken(token); $event.preventDefault()"
      (tokenFocus)="activeIndex = i"
    >
      {{ token.value[displayWith] }}
    </sky-token>
  }
  <ng-content select="sky-token" />
  <div class="sky-tokens-content" [attr.role]="gridRoleActive() ? 'row' : null">
    <div [attr.role]="gridRoleActive() ? 'gridcell' : null">
      <ng-content />
    </div>
  </div>
</div>
