<form [formGroup]="timepickerForm">
  <sky-timepicker #timePicker>
    <input
      id="timeInput"
      formControlName="time"
      placeholder="Time"
      [returnFormat]="returnFormat"
      [skyTimepickerInput]="timePicker"
      [skyTimepickerClearInvalidValues]="clearInvalidValues"
      [timeFormat]="timeFormat"
    />
  </sky-timepicker>
</form>
